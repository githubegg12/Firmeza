services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: Qwe.123*
      POSTGRES_DB: FirmezaDB
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d FirmezaDB"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Firmeza.API/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=FirmezaDB;Username=coder;Password=Qwe.123*
      - JwtSettings__SecretKey=FirmezaSecureJwtKey2024!@#$%^&*()_+1234567890ABCDEFGHIJKLMNOP
    ports:
      - "5277:8080"
    depends_on:
      tests:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Firmeza.web/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=FirmezaDB;Username=coder;Password=Qwe.123*
    ports:
      - "5000:8080"
    depends_on:
      tests:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  client:
    build:
      context: ./Firmeza.Client
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      tests:
        condition: service_completed_successfully
      api:
        condition: service_started
