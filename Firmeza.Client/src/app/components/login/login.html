<div class="login-container">
    <div class="login-card">
        <h1>Iniciar Sesión</h1>
        <p class="subtitle">Bienvenido a Firmeza</p>

        @if (error()) {
        <div class="error-message">
            {{ error() }}
        </div>
        }

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required email
                    placeholder="tu@email.com" [disabled]="loading()" />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" required minlength="6"
                    placeholder="••••••••" [disabled]="loading()" />
            </div>

            <button type="submit" class="btn-primary" [disabled]="loading() || !loginForm.form.valid">
                @if (loading()) {
                Iniciando sesión...
                } @else {
                Iniciar Sesión
                }
            </button>
        </form>

        <div class="register-link">
            ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
        </div>
    </div>
</div>
