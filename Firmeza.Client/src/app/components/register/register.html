<div class="register-container">
    <div class="register-card">
        <h1>Crear Cuenta</h1>
        <p class="subtitle">Únete a Firmeza</p>

        @if (success()) {
        <div class="success-message">
            ¡Registro exitoso! Redirigiendo al login...
        </div>
        }

        @if (error()) {
        <div class="error-message">
            {{ error() }}
        </div>
        }

        <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">Nombre(s) *</label>
                    <input type="text" id="firstName" name="firstName" [(ngModel)]="formData.firstName" required
                        placeholder="Juan" [disabled]="loading()" />
                </div>

                <div class="form-group">
                    <label for="lastName">Apellido(s) *</label>
                    <input type="text" id="lastName" name="lastName" [(ngModel)]="formData.lastName" required
                        placeholder="Pérez García" [disabled]="loading()" />
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" [(ngModel)]="formData.email" required email
                    placeholder="tu@email.com" [disabled]="loading()" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="documentId">Documento de Identidad *</label>
                    <input type="text" id="documentId" name="documentId" [(ngModel)]="formData.documentId" required
                        placeholder="12345678" [disabled]="loading()" />
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Teléfono *</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" [(ngModel)]="formData.phoneNumber" required
                        placeholder="3001234567" [disabled]="loading()" />
                </div>
            </div>

            <div class="form-group">
                <label for="address">Dirección *</label>
                <input type="text" id="address" name="address" [(ngModel)]="formData.address" required
                    placeholder="Calle 123 #45-67" [disabled]="loading()" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" [(ngModel)]="formData.password" required
                        minlength="6" placeholder="••••••••" [disabled]="loading()" />
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                        [(ngModel)]="formData.confirmPassword" required minlength="6" placeholder="••••••••"
                        [disabled]="loading()" />
                </div>
            </div>

            <button type="submit" class="btn-primary" [disabled]="loading() || !registerForm.form.valid">
                @if (loading()) {
                Registrando...
                } @else {
                Registrarse
                }
            </button>
        </form>

        <div class="login-link">
            ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
        </div>
    </div>
</div>
