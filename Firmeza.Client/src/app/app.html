<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <a routerLink="/">Firmeza</a>
    </div>

    <div class="nav-links">
      <a routerLink="/cart" class="cart-link">
        <span class="cart-icon">🛒</span>
        @if (cartService.itemCount() > 0) {
        <span class="cart-badge">{{ cartService.itemCount() }}</span>
        }
      </a>

      @if (authService.isAuthenticated()) {
      <span class="user-info">{{ authService.currentUser()?.userName }}</span>
      <button class="btn-logout" (click)="authService.logout()">Cerrar Sesión</button>
      } @else {
      <a routerLink="/login" class="nav-link">Iniciar Sesión</a>
      <a routerLink="/register" class="nav-link btn-register">Registrarse</a>
      }
    </div>
  </div>
</nav>

<main>
  <router-outlet />
</main>
