server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests if needed, though usually handled by docker-compose networking or full URL in client
    # location /api/ {
    #     proxy_pass http://api:8080/;
    # }
}
